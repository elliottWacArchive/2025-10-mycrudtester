version: "3.3"
services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always
    links:
      - db:db

  db:
    image: mongo
    container_name: mongodb_container
    command: mongod --quiet --logpath /dev/null
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"
    restart: always
